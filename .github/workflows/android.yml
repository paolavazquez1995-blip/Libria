name: Crear APK de Libria

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extraer proyecto
        run: |
          mkdir -p /tmp/libria
          python3 - <<'PY'
          import zipfile, glob, os
          files = glob.glob("*.zip")
          if not files:
              raise SystemExit("No se encontró el ZIP del proyecto")
          with zipfile.ZipFile(files[0]) as z:
              z.extractall("/tmp/libria")
          for _ in range(3):
              nested = glob.glob("/tmp/libria/**/*.zip", recursive=True)
              if not nested:
                  break
              for f in nested:
                  with zipfile.ZipFile(f) as z:
                      z.extractall(os.path.dirname(f))
                  os.remove(f)
          PY
          PROJECT_FILE=$(find /tmp/libria -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "No se encontró settings.gradle.kts dentro del ZIP"
            find /tmp/libria -maxdepth 5 -type f
            exit 1
          fi
          echo "Proyecto encontrado: $PROJECT_FILE"

      - name: Compilar APK
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          PROJECT=$(dirname "$(find /tmp/libria -name settings.gradle.kts -print -quit)")
          /tmp/gradle-8.9/bin/gradle -p "$PROJECT" assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Libria-APK
          path: /tmp/libria/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
